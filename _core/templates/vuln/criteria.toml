# 판정 기준표 템플릿. _core/sweep new <취약점ID> 가 루트에 <취약점ID>/criteria.toml 로 복사한다.
# 규칙
#   - 값은 반드시 공식 원문에서 옮긴다. 2차 보도, 블로그 값은 쓰지 않는다 (참고 사항은 advisory.md에만 적는다).
#   - 루트 키(id, title, judgement_rules, next_releases 등)는 모든 [표] 헤더보다 위에 둔다. TOML은 헤더 아래 키를 그 표에 넣는다.
#   - 이번 공지에 해당하지 않는 제품 섹션([java], [mysql], [oracle_home], [nginx])은 지운다. 섹션이 없는 제품은 판정하지 않고 보고서에도 넣지 않는다.

id = "YYYY-MM-DD_vendor_key"          # 폴더명과 같아야 함 (YYYY-MM-DD_벤더_공지키 또는 CVE-YYYY-NNNN, _core/sweep index 가 검사)
vendor = "vendor"                      # 소문자 (oracle, openssl, apache, microsoft ...)
vendor_label = "Vendor"                # 보고서 문구에 쓰는 이름 (예: "영향(Oracle 제품)")
title = "공식 공지 제목 그대로"
url = "https://..."
published = 2026-01-01
revision = "Rev 1"
total_patches = 0                      # 원문에 수치가 없으면 지운다
# min_collector = "2026.11.2"          # 이 공지에 필요한 최소 수집기 버전 (META collector). 더 오래된 결과는 judge가 재수집 대상으로 알림

judgement_rules = [
  "보고서 판정 기준 시트에 들어갈 문장. 고객이 읽는 문장으로 쓴다.",
]

next_releases = [
  # { date = "2026-01-20", type = "CPU" },
]

# 선택: 보고서 문구를 공지에 맞게 바꿀 때 (없으면 Java 공지 기준 기본 문구)
# priority_desc = { P1 = "...", P2 = "...", P3 = "..." }     # 요약 시트 우선순위 설명
# report_scope = "EC2 전체. 서버 내부는 ..."                 # 요약 시트 조사 범위 (notes.toml scope가 우선)
# collected_items = "패키지 목록, ..."                        # 점검 방법 시트 수집 항목
# limitations = ["...", "..."]                                # 점검 방법 시트 한계 (notes.toml limitations가 우선)

# ---------------- Java (Oracle Java SE, OpenJDK 공지일 때)
[java]
primary_vendors = ["Oracle Java SE", "Oracle GraalVM"]   # 공지 대상 제품으로 볼 vendor (_core/vsweep/products.py java_vendor 반환값)
derivative_label = "OpenJDK 계열"

[java.latest_affected]     # 계열별 최신 영향 버전, 다섯 자리까지. 표에 없는 계열은 EOL
"8" = "8.0.000"
"17" = "17.0.0.0.0"

[java.derivative_latest_affected]   # 파생 빌드만 기준이 다를 때 (예: Java 8 업데이트 번호 차이)
# "8" = "8.0.000"

[java.max_server_cvss]     # 서버 환경에 해당하는 CVE 중 계열별 최고 점수
"8" = 0.0
"17" = 0.0

[java.exclude_vendors]     # 이번 공지와 무관한 vendor와 보고서 문구
"IBM Java" = "공지 대상 아님(IBM Java, IBM 보안 공지로 별도 확인)"

# ---------------- MySQL
[mysql]
affected = [["8.4.0", "8.4.0"]]   # [하한, 상한] 포함 범위 목록
eol_below = "8.4.0"                # 이보다 낮으면 EOL
max_cvss = 0.0
mariadb_note = "해당 없음(MariaDB, Oracle 제품 아님)"

[mysql.eol_notes]
# "8.0" = "EOL(MySQL 8.0, 공지의 Server 영향 목록에 없음)"

# ---------------- Oracle Home (DB, Client, WebLogic)
[oracle_home]
instant_client_note = "공지 대상 목록에 없음(클라이언트 라이브러리), 참고"

[oracle_home.eol_prefixes]   # 제품별 EOL 버전 접두어 (WebLogic처럼 지원 중인 12.x가 있으면 섞지 않는다)
Client = ["11.", "12.", "18."]
Database = ["11.", "12.", "18."]

# ---------------- nginx (nginx.org 보안 공지일 때)
[nginx]
supported_branches = ["1.30", "1.31"]          # nginx.org의 현재 stable, mainline 계열. 그 밖의 계열은 비고에 지원 종료로 표시
unsupported_note = "지원 종료 계열: 1.30.7 이상으로 올려야 함"
plus_note = "NGINX Plus: F5 공지의 Plus 버전표로 확인"

[nginx.controller_notes]                        # NGXCTL 종류별 비고
"ingress-nginx" = "Kubernetes ingress-nginx 컨트롤러 컨테이너"
"f5-nginx-ingress" = "F5 NGINX Ingress Controller 컨테이너"

# 배포판 패키지의 수정 버전. 키는 META os_id(ID-VERSION_ID, rhel 계열은 주 버전만도 됨). 배포판 공식 공지에서만 옮긴다
[nginx.distro_fixed."amzn-2023"]
version = "0.0.0-0.amzn2023.0.0"
kind = "rpm"                                    # rpm | deb
source = "ALAS2023-YYYY-NNNN (YYYY-MM-DD)"

# ---------------- 범용 소프트웨어 (수집기 SW 레코드: postgresql, postgresql-client, httpd, npm-mongodb, linux-kernel)
# 설명은 _core/vsweep/software.py 첫머리. 공지와 무관한 제품 표는 지운다
[software.httpd]
label = "Apache httpd"
branch_parts = 2                 # 2.4.x 계열 안에서만 수정 버전 비교
supported_branches = ["2.4"]
distro_backport = true           # 배포판 패키지는 버전 번호 대신 distro_fixed로 판단
package_re = "^(httpd|apache2-bin)$"

[[software.httpd.distro_fixed]]
os = "ubuntu-24.04"              # META os_id. rhel-9 처럼 주 버전만 쓰면 rhel-9.x 전체
package = "apache2-bin"
version = "0.0.0-0ubuntu0"
kind = "deb"                     # deb | rpm
source = "USN-0000-1 (YYYY-MM-DD)"
cves = []                        # 비우면 이 제품의 모든 CVE. status = "not_affected" 로 해당 없음 표시
# branch = "5.10"                # 같은 패키지 이름에 계열이 여럿일 때(Amazon Linux 2 kernel). 설치 패키지 버전이 이 접두어일 때만 적용
# [software.linux-kernel.flag_notes]   플래그가 1이면 비고에 붙일 문구 (예: boot_enabled = "nfs-server 부팅 시 자동 시작 설정됨")

# ---------------- 보고서 판정 기준 시트용 제품 표
[[products]]
name = "제품명"
versions = "원문의 영향 버전 문자열"
max_cvss = 0.0
note = ""

# ---------------- 판정에 쓰는 제품의 CVE (CVE_INDEX.csv에 들어감)
# id 형식: CVE-YYYY-NNNN... (대문자). scope: server | client | both (원문에 구분이 없으면 지운다)
# nginx CVE는 판정용 키를 더한다
#   range = ["1.9.5", "1.31.8"]      nginx.org Vulnerable 범위(포함)
#   fixed = ["1.31.9", "1.30.7"]     nginx.org Not vulnerable (같은 계열에서 그 이상이면 수정됨)
#   cond = "http2"                   사용 조건 키 (_core/vsweep/products.py NGX_CONDS)
#   condition = "HTTP/2 사용 시"      보고서 판정 기준 시트에 쓰는 조건 설명
# [software] 제품 CVE는 판정용 키를 더한다
#   sw = ["httpd"]                   해당 제품 키
#   range = ["2.4.55", "2.4.70"]     영향 범위(포함), fixed = ["2.4.71"] 같은 계열 수정 버전
#   cond = ["mod_http2", "h2"]       사용 조건 플래그(모두 1이어야 해당). 없으면 조건 없음
[[cves]]
id = "CVE-0000-0000"
product = "제품명"
component = "구성요소"
cvss = 0.0
remote_unauth = false
scope = "both"
versions = "영향 버전"
