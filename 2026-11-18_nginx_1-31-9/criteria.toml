# 판정 기준표: nginx 1.31.9 mainline, 1.30.7 stable 보안 수정 (2026-11-18)
# 영향 범위와 수정 버전은 nginx.org 보안 공지 목록에서 옮겼다 (2026-11-19 확인).
# CVSS와 구성요소 이름은 CVE 레코드(CNA: F5)에서, 배포판 수정 버전은 각 배포판의 공식 보안 공지에서 옮겼다.
# 원문: https://nginx.org/en/security_advisories.html , https://nginx.org/en/CHANGES , https://nginx.org/en/CHANGES-1.30

id = "2026-11-18_nginx_1-31-9"
vendor = "nginx"
vendor_label = "nginx"
title = "nginx-1.30.7 stable and nginx-1.31.9 mainline versions have been released"
url = "https://nginx.org/en/security_advisories.html"
published = 2026-11-18
revision = "2026-11-19 확인"
min_collector = "2026.11.2"   # nginx 수집(NGINX, NGXCONF)이 들어간 수집기 버전

# ---------------- 보고서에 들어가는 판정 규칙
judgement_rules = [
  "nginx.org 보안 공지의 영향 범위(Vulnerable)에 들고 수정 버전(1.31.9 이상, 1.30 계열은 1.30.7 이상)에 들지 않는 버전을 영향 버전으로 판정했습니다.",
  "nginx가 지원하는 계열은 1.31(mainline)과 1.30(stable)뿐입니다. 1.29 이하 계열은 수정 버전이 나오지 않으므로 1.30.7 이상으로 올려야 합니다.",
  "취약점마다 해당 기능을 쓸 때만 공격할 수 있습니다(예: HTTP/2, mail 프록시). 실행 중인 nginx의 설정 파일을 읽어 기능별 사용 여부를 확인했고, 영향 버전이라도 해당 기능을 하나도 쓰지 않으면 P3로 분류했습니다.",
  "설정 확인은 지시어 사용 여부만 보는 단순 대조입니다. 지시어가 같은 server, location 블록에 있는지는 보지 않으므로 조건 해당은 가능성으로 보고, 최종 판단은 설정 검토로 합니다.",
  "Ubuntu, Debian, RHEL 등 배포판 패키지는 보안 수정을 반영해도 nginx 버전 번호가 바뀌지 않는 경우가 많습니다. 배포판 공지에 수정 패키지 버전이 있으면 패키지 버전으로 비교했고, 아직 없으면 P2(배포판 수정 확인 필요)로 분류했습니다.",
  "nginx.org 패키지, 소스 빌드, 컨테이너 이미지 안의 nginx는 버전 번호로 판정했습니다.",
  "OpenResty, Tengine, Angie, NGINX Plus는 각 벤더가 따로 수정본을 내므로 확인 필요로 분류했습니다.",
  "실행 파일을 교체한 뒤 재기동하지 않은 nginx는 이전 바이너리로 동작하므로, 재기동 전까지는 수정되지 않은 것으로 봅니다.",
  "CVSS는 CVE 레코드(발급 기관 F5)의 CVSS 3.1 점수입니다.",
]

next_releases = []

priority_desc = { P1 = "nginx(nginx.org 패키지, 소스 빌드, 컨테이너 이미지)가 영향 버전으로 실행 중이고 공지 조건에 해당하거나 설정을 확인하지 못함. 배포판 수정 버전보다 낮은 배포판 패키지 포함", P2 = "배포판 패키지 nginx가 영향 범위 버전으로 실행 중이고 배포판 수정 버전이 아직 확인되지 않음", P3 = "영향 버전이 설치만 되어 있거나(미실행, 이미지 레이어), 실행 중이지만 수집한 설정에 공지 조건이 없음", "확인 필요" = "OpenResty, NGINX Plus 같은 포크 제품이거나 버전을 읽지 못한 항목이 있음" }

report_scope = "EC2 전체, ECS, EKS, Elastic Beanstalk, ECR. 서버 내부는 패키지, 실행 중 nginx와 설정(지시어 사용 여부), 디스크 전체의 nginx 바이너리, 컨테이너"
collected_items = "패키지 목록, 실행 중 nginx master 프로세스와 실행 바이너리의 버전, 모듈(컨테이너 포함), 설정 파일의 지시어 사용 여부(HTTP/2, HTTP/3, resolver, mirror, SSI, mail, stream 등, 설정 값은 수집하지 않음), 로컬 디스크 전체의 nginx 바이너리와 컨테이너 이미지 레이어, SCTP 커널 모듈 상태"
limitations = [
  "설정 확인은 지시어 사용 여부만 보는 단순 대조로, 같은 server, location 블록 안에 있는지와 실제 트래픽 경로는 확인하지 않음",
  "nginx 바이너리는 실행하지 않고 내장 문자열로 버전과 모듈을 읽음. 배포판 패키지는 버전 번호로 수정 여부를 알 수 없어 패키지 버전과 배포판 공지로 판단",
  "Windows의 nginx는 설정 파일을 읽지 않아 조건 해당 여부를 확인하지 못함",
  "ECR 이미지와 Fargate 작업 안의 nginx는 확인하지 않음(EC2에서 실행 중인 컨테이너만 확인)",
  "외부 노출은 인터넷용 ALB/NLB 대상 등록 기준이며, 등록 포트가 nginx 포트인지는 서비스별 확인 필요",
]

# ---------------- nginx
[nginx]
supported_branches = ["1.30", "1.31"]
unsupported_note = "지원 종료 계열: 1.30.7 이상으로 올려야 함"
plus_note = "NGINX Plus: F5 공지(K000163925-K000163935)의 Plus 버전표로 확인"

[nginx.controller_notes]
"ingress-nginx" = "Kubernetes ingress-nginx 컨트롤러: 프로젝트가 2026-03-24 보관(archived)되어 보안 수정이 나오지 않음"
"f5-nginx-ingress" = "F5 NGINX Ingress Controller: F5 공지로 확인"

# 배포판 수정 버전 (2026-11-19 확인). Ubuntu, Debian 안정판은 아직 수정 버전 없음, RHEL은 미확인
[nginx.distro_fixed."amzn-2023"]
version = "1.30.7-1.amzn2023.0.1"
kind = "rpm"
source = "ALAS2023-2026-3494 (2026-11-18)"

# Amazon Linux 2는 amazon-linux-extras nginx1 토픽 패키지
[nginx.distro_fixed."amzn-2"]
version = "1.30.7-1.amzn2.0.1"
kind = "rpm"
source = "ALAS2NGINX1-2026-018 (2026-11-19)"

# ---------------- 보고서 판정 기준 시트용
[[products]]
name = "nginx (open source)"
versions = "1.31.8 이하 (CVE별 시작 버전은 아래 표), 수정 버전 1.31.9, 1.30.7"
max_cvss = 8.1
note = "CVE 10건, 모두 인증 없이 원격"

[[products]]
name = "NGINX Plus"
versions = "R33 이후 (CVE 레코드 기준)"
max_cvss = 8.1
note = "F5 공지로 확인"

# ---------------- 판정에 쓰는 CVE (nginx.org 공지 목록 순서)
# severity는 nginx.org 표기(major, medium, minor). cond는 _core/vsweep/products.py NGX_CONDS 키

[[cves]]
id = "CVE-2026-123634"
product = "nginx"
component = "resolver"
cvss = 8.1
remote_unauth = true
severity = "medium"
versions = "0.6.18-1.31.8 (수정 1.31.9, 1.30.7)"
range = ["0.6.18", "1.31.8"]
fixed = ["1.31.9", "1.30.7"]
cond = "resolver_subrequest"
condition = "resolver 사용, proxy_pass 서버 이름에 변수, 같은 이름을 SSI 또는 mirror 하위 요청이 해석"

[[cves]]
id = "CVE-2026-123007"
