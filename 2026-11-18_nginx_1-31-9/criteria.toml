component = "ngx_http_v2_module (flow control)"
cvss = 8.1
remote_unauth = true
severity = "major"
versions = "1.9.5-1.31.8 (수정 1.31.9, 1.30.7)"
range = ["1.9.5", "1.31.8"]
fixed = ["1.31.9", "1.30.7"]
cond = "http2"
condition = "HTTP/2 사용(listen ... http2 또는 http2 on)"

[[cves]]
id = "CVE-2026-121810"
