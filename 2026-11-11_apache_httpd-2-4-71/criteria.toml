# 판정 기준표: Apache HTTP Server 2.4.71 보안 수정 (2026-11-11)
# 영향 범위, 수정 버전, 심각도는 Apache httpd 2.4 취약점 페이지에서 옮겼다 (2026-11-19 확인).
# CVSS는 CVE 레코드의 CISA ADP 점수(CNA인 Apache는 점수를 매기지 않음). 배포판 수정 버전은 각 배포판 공식 공지에서 옮겼다.
# 원문: https://httpd.apache.org/security/vulnerabilities_24.html

id = "2026-11-11_apache_httpd-2-4-71"
vendor = "apache"
vendor_label = "Apache httpd"
title = "Fixed in Apache HTTP Server 2.4.71"
url = "https://httpd.apache.org/security/vulnerabilities_24.html"
published = 2026-11-11
revision = "2026-11-19 확인"
min_collector = "2026.11.3"   # SW 레코드(httpd)가 들어간 수집기 버전

judgement_rules = [
  "Apache httpd 2.4 취약점 페이지의 영향 범위(Affects)와 수정 버전(2.4.71)으로 판정했습니다.",
  "취약점마다 해당 모듈을 쓸 때만 공격할 수 있습니다(mod_http2, mod_md, mod_vhost_alias). 실행 중인 httpd에 실제로 올라온 모듈과 설정 지시어로 조건을 확인했고, 영향 버전이라도 조건이 하나도 없으면 P3로 분류했습니다.",
  "Amazon Linux, RHEL, Ubuntu, Debian 패키지는 보안 수정을 반영해도 httpd 버전 번호가 바뀌지 않으므로(백포트) 버전 번호 대신 배포판 공지의 수정 패키지 버전과 비교했습니다. RHEL은 mod_http2가 별도 패키지라 그 패키지 버전을 비교했습니다.",
  "배포판 공지에 수정 패키지가 있는데 설치 버전이 낮으면 P1, 배포판 공지를 확인하지 못한 CVE가 남으면 P2(배포판 확인 필요)로 분류했습니다.",
  "공식 httpd 컨테이너 이미지와 소스 빌드는 버전 번호로 판정했습니다.",
  "실행 파일을 교체한 뒤 재시작하지 않은 httpd는 이전 바이너리로 동작하므로, 재시작 전까지는 수정되지 않은 것으로 봅니다.",
  "CVSS는 CVE 레코드의 CISA ADP 점수입니다. Apache는 심각도(critical, important, low)만 매깁니다.",
]

next_releases = []

priority_desc = { P1 = "httpd가 영향 버전으로 실행 중이고 해당 모듈을 쓰거나 확인하지 못함(소스 빌드, 컨테이너), 또는 배포판 수정 패키지가 나왔는데 설치하지 않음", P2 = "배포판 httpd가 실행 중이고 배포판 수정 여부를 확인하지 못한 CVE가 있음", P3 = "영향 버전이 설치만 되어 있거나(미실행, 이미지 레이어), 실행 중이지만 해당 모듈을 쓰지 않음", "확인 필요" = "버전을 읽지 못한 항목이 있음" }

report_scope = "EC2 전체, ECS, EKS, Elastic Beanstalk, ECR. 서버 내부는 패키지, 실행 중 httpd와 로드된 모듈, 설정 지시어 사용 여부, 디스크 전체의 httpd 바이너리, 컨테이너"
collected_items = "패키지 목록(httpd, apache2, mod_http2, mod_md), 실행 중 httpd 부모 프로세스와 실행 바이너리의 버전(컨테이너 포함), 프로세스에 올라온 모듈(mod_*.so), 설정 지시어 사용 여부(Protocols h2, MDomain, VirtualDocumentRoot, 설정 값은 수집하지 않음), 로컬 디스크 전체의 httpd 바이너리와 컨테이너 이미지 레이어"
limitations = [
  "모듈은 프로세스 메모리에 올라온 공유 모듈(mod_*.so)로 판단하므로, httpd에 정적으로 컴파일된 모듈은 보이지 않음",
  "설정 확인은 지시어 사용 여부만 보는 단순 대조이며, 특정 VirtualHost에만 적용되는지는 확인하지 않음",
  "Windows의 httpd는 모듈과 설정을 읽지 않아 조건 해당 여부를 확인하지 못함",
  "ECR 이미지와 Fargate 작업 안의 httpd는 확인하지 않음(EC2에서 실행 중인 컨테이너와 디스크의 이미지 레이어만 확인)",
  "외부 노출은 인터넷용 ALB/NLB 대상 등록 기준이며, 등록 포트가 httpd 포트인지는 서비스별 확인 필요",
]

# ---------------- 범용 소프트웨어 판정 (수집기 SW 레코드)
[software.httpd]
label = "Apache httpd"
branch_parts = 2
supported_branches = ["2.4"]
unsupported_note = "지원 종료 계열(2.2 이하): 수정 버전 없음"
distro_backport = true
package_re = "^(httpd|apache2-bin)$"

