# 판정 기준표: PostgreSQL 18.7, 17.12, 16.16, 15.20, 14.25 업데이트 릴리스 (2026-11-12)
# CVE별 영향 계열, 수정 버전, 구성요소, CVSS는 PostgreSQL 보안 페이지 표에서, 목록은 릴리스 공지에서 옮겼다 (2026-11-19 확인).
# 원문: https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/
#       https://www.postgresql.org/support/security/ , https://www.postgresql.org/support/versioning/

id = "2026-11-12_postgresql_18-7"
vendor = "postgresql"
vendor_label = "PostgreSQL"
title = "PostgreSQL 18.7, 17.12, 16.16, 15.20, 14.25, and 19 RC 2 Released!"
url = "https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/"
published = 2026-11-12
revision = "2026-11-19 확인"
min_collector = "2026.11.3"   # SW 레코드(PostgreSQL)가 들어간 수집기 버전

judgement_rules = [
  "PostgreSQL 보안 페이지의 CVE별 영향 계열(Affected)과 수정 버전(Fixed)으로 판정했습니다. 같은 계열에서 수정 버전보다 낮으면 영향 버전입니다(예: 16.15는 영향, 16.16은 수정).",
  "PostgreSQL이 지원하는 계열은 14-18입니다. 14는 14.25가 마지막 릴리스로 지원이 끝났고, 13 이하는 이미 지원이 끝나 수정 버전이 없습니다.",
  "배포판 패키지(Amazon Linux, RHEL, Ubuntu, Debian, PGDG)도 PostgreSQL 마이너 버전을 그대로 따르므로 버전 번호로 판정했습니다. 다만 지원이 끝난 계열의 배포판 패키지는 배포판이 따로 수정본을 낼 수 있어 P2(배포판 확인 필요)로 두었습니다.",
  "서버 취약점 대부분은 데이터베이스 계정(객체 생성 권한 등)이 있어야 공격할 수 있고, 성공하면 데이터베이스 실행 계정 권한으로 코드가 실행됩니다. 인증 없이 가능한 서버 취약점은 CVE-2026-116322(18 계열, 서버 재시작) 1건입니다.",
  "PL/Perl, PL/Tcl, dblink, dict_int 관련 CVE는 해당 확장 라이브러리 파일이 설치된 경우만 조건 해당으로 보았습니다. 데이터베이스 안에서 확장을 실제로 만들었는지는 확인하지 않았습니다(DB 접속 없음).",
  "pg_dump, pg_restore, psql 등 클라이언트 도구 CVE는 서버 밖의 클라이언트 도구 설치본(pg_dump, psql 바이너리)으로 판정했습니다. 실행 여부는 보지 않으므로 P3로 분류됩니다.",
  "RDS, Aurora PostgreSQL은 AWS 관리형이라 서버 점검 대상이 아니며, 엔진 버전을 따로 대조했습니다.",
  "CVSS는 PostgreSQL 보안 페이지의 CVSS 3.1 점수입니다.",
]

next_releases = [   # https://www.postgresql.org/developer/roadmap/ (2026-11-19 확인)
  { date = "2027-02-11", type = "정기 마이너 릴리스" },
  { date = "2027-05-13", type = "정기 마이너 릴리스" },
]

priority_desc = { P1 = "PostgreSQL 서버가 영향 버전 또는 지원 종료 계열로 실행 중 (패키지, 소스 빌드, 컨테이너 포함)", P2 = "지원 종료 계열의 배포판 패키지가 실행 중이라 배포판 수정 여부 확인이 필요함", P3 = "영향 버전이 설치만 되어 있거나(미실행 서버, 클라이언트 도구, 이미지 레이어), 확장 관련 CVE만 해당하는데 확장이 설치되지 않음", "확인 필요" = "버전을 읽지 못한 항목이 있음" }

report_scope = "EC2 전체, RDS, Aurora, ECS, EKS, ECR. 서버 내부는 패키지, 실행 중 PostgreSQL 서버와 확장 라이브러리, 디스크 전체의 postgres, pg_dump, psql 바이너리, 컨테이너"
collected_items = "패키지 목록, 실행 중 PostgreSQL 서버(부모 프로세스)와 실행 바이너리의 버전(컨테이너 포함), 같은 설치의 확장 라이브러리(plperl, pltcl, dblink, dict_int) 존재 여부, 로컬 디스크 전체의 postgres, pg_dump, psql 바이너리와 컨테이너 이미지 레이어"
limitations = [
  "데이터베이스에 접속하지 않으므로 확장을 실제로 만들었는지(CREATE EXTENSION), 구독(subscription) 소유자가 superuser인지는 확인하지 않음",
  "버전은 바이너리 내장 문자열로 읽으며, 바이너리를 실행하지 않음",
  "RDS, Aurora는 AWS API의 엔진 버전으로만 대조함",
  "ECR 이미지와 Fargate 작업 안의 PostgreSQL은 확인하지 않음(EC2에서 실행 중인 컨테이너와 디스크의 이미지 레이어만 확인)",
  "외부 노출은 인터넷용 ALB/NLB 대상 등록 기준이며, 등록 포트가 PostgreSQL 포트인지는 서비스별 확인 필요",
]

# ---------------- 범용 소프트웨어 판정 (수집기 SW 레코드)
[software.postgresql]
label = "PostgreSQL 서버"
branch_parts = 1
supported_branches = ["14", "15", "16", "17", "18"]
unsupported_note = "지원 종료 계열(13 이하): 수정 버전 없음, 지원 계열로 업그레이드 필요"
distro_backport = false
package_re = "^postgresql(-[0-9]+|[0-9]+)?(-server)?$"

[software.postgresql.branch_notes]
"14" = "PostgreSQL 14는 14.25가 마지막 릴리스(2026-11-12 지원 종료), 15 이상으로 업그레이드 계획 필요"

[software.postgresql-client]
label = "PostgreSQL 클라이언트 도구"
merge_dir = true
branch_parts = 1
supported_branches = ["14", "15", "16", "17", "18"]
unsupported_note = "지원 종료 계열(13 이하) 클라이언트 도구: 수정 버전 없음"
distro_backport = false
package_re = "^postgresql(-client-[0-9]+|[0-9]+)?$"

[software.postgresql-client.branch_notes]
"14" = "PostgreSQL 14는 14.25가 마지막 릴리스(2026-11-12 지원 종료)"

# ---------------- 보고서 판정 기준 시트용
[[products]]
name = "PostgreSQL 서버"
versions = "18.6, 17.11, 16.15, 15.19, 14.24 이하 (수정 18.7, 17.12, 16.16, 15.20, 14.25)"
max_cvss = 8.8
note = "서버 CVE 46건(core server 43, contrib 3). 대부분 DB 계정 필요, 성공 시 DB 실행 계정으로 코드 실행"

[[products]]
name = "PostgreSQL 클라이언트 도구"
versions = "pg_dump, pg_restore, psql, pg_basebackup, vacuumdb, reindexdb (수정 버전 같음)"
max_cvss = 8.8
note = "클라이언트 CVE 6건. 조작된 덤프, 서버 응답으로 클라이언트 쪽 코드 실행"

